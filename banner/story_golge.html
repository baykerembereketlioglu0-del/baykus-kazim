<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8">
<title>Gölge: Instagram hikâye afişi</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Caveat:wght@700&family=Inter:wght@800&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<!-- Instagram hikâye afişi (1080x1920). Alttaki kesikli kutuya bağlantı çıkartması konur.
     Üst ~250 px ve alt ~340 px'i Instagram arayüzü örter. -->
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../ortak/cizim.js"></script>
<script src="../ortak/karakterler.js"></script>
<script src="../ortak/sahneler.js"></script>
<script src="../ortak/ekip.js"></script>
<script src="../ortak/ara-sahneler.js"></script>
<script src="../ortak/ara-sahneler-2.js"></script>
<script src="../ortak/mehmetali.js"></script>
<script src="../ortak/ara-sahneler-3.js"></script>
<script src="../ortak/ara-sahneler-4.js"></script>
<script src="../ortak/mekanlar.js"></script>
<script src="../ortak/ara-sahneler-5.js"></script>
<script src="../ortak/ara-sahneler-6.js"></script>
<script src="../ortak/ara-sahneler-7.js"></script>
<script src="../ortak/ara-sahneler-8.js"></script>
<script src="../ortak/ara-sahneler-9.js"></script>
<script>
(async () => {
  for (const f of ['900 170px Cinzel', '600 34px Cinzel', '700 64px Caveat', '800 32px Inter', "60px 'Noto Color Emoji'"]) await document.fonts.load(f, 'AaÇĞİÖŞÜıâ🕯');
  await document.fonts.ready;
  const cv = document.getElementById('c'); c = cv.getContext('2d'); c.lineJoin = c.lineCap = 'round'; initTextures();
  const W = 1080, H = 1920, CX = W / 2, t = 1.4; LIGHTS = [];
  const lights = () => { c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'lighter'; for (const g of LIGHTS) { c.fillStyle = rg(g.x, g.y, 0, g.r, [[0, g.col], [1, 'rgba(0,0,0,0)']]); c.fillRect(g.x - g.r, g.y - g.r, g.r * 2, g.r * 2); } c.restore(); LIGHTS = []; };
  // yağmurlu çay bahçesi: boş sofraya Kâzım oturmuş, fener aralarında (ekranın ortasına kaydırılmış)
  c.setTransform(1.3, 0, 0, 1.3, 72, 233);
  sofraSon({ t, k: .4, talk: { kazim: 0 } });
  lights();
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.fillStyle = lg(0, 0, 0, 900, [[0, 'rgba(6,5,10,.98)'], [.74, 'rgba(6,5,10,.9)'], [1, 'rgba(6,5,10,0)']]); c.fillRect(0, 0, W, 900);
  c.fillStyle = lg(0, 1250, 0, H, [[0, 'rgba(6,5,10,0)'], [.2, 'rgba(6,5,10,.92)'], [1, 'rgba(6,5,10,.98)']]); c.fillRect(0, 1250, W, H - 1250);
  c.save(); c.setTransform(1.5, 0, 0, 1.5, 0, 0); drawRain(t, 720, 1280, 1, .7); c.restore();
  const sp = (txt, x, y, font, fill, s = 0, glow) => { c.save(); c.font = font; c.letterSpacing = s + 'px'; c.textAlign = 'center'; if (glow) { c.shadowColor = glow; c.shadowBlur = 40; } c.fillStyle = fill; c.fillText(txt, x + s / 2, y); c.restore(); };
  sp('BAYKUŞ KAZIM', CX, 300, '600 34px Cinzel,Georgia,serif', 'rgba(232,206,160,.9)', 12);
  sp('YENİ BÖLÜM', CX, 372, '800 32px Inter,Arial,sans-serif', '#ff6a5a', 8);
  sp('GÖLGE', CX, 548, '900 170px Cinzel,Georgia,serif', lg(0, 410, 0, 560, [[0, '#fff1c8'], [.5, '#f2c463'], [1, '#b47a26']]), 10, 'rgba(255,170,70,.6)');
  sp('Kalabalık güneşte toplanır;', CX, 640, "700 64px Caveat,cursive", '#f3e6cc');
  sp('dost, karanlıkta bilinir.', CX, 712, "700 64px Caveat,cursive", '#f3e6cc');
  // soru + bağlantı alanı (altta ortada; Instagram'ın alt arayüzünün üstünde)
  const BW = 600, BH = 120, BX = CX - BW / 2, BY = 1452;
  sp("Karanlık gününde kim kaldı? 🕯️", CX, BY - 42, "700 62px Caveat,cursive,'Noto Color Emoji'", '#f3e6cc');
  c.save(); c.fillStyle = 'rgba(8,8,14,.6)'; c.beginPath(); c.roundRect(BX, BY, BW, BH, 34); c.fill(); c.setLineDash([16, 12]); c.lineWidth = 4; c.strokeStyle = 'rgba(242,196,99,.9)'; c.stroke(); c.restore();
  sp('İZLEMEK İÇİN DOKUN', CX, BY + BH / 2 + 11, '800 28px Inter,Arial,sans-serif', 'rgba(243,230,204,.42)', 3);
  c.fillStyle = rg(CX, H * .5, 500, 1250, [[0, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,.45)']]); c.fillRect(0, 0, W, H);
  c.save(); c.globalAlpha = .05; c.globalCompositeOperation = 'overlay'; c.fillStyle = c.createPattern(TEX.grain[0], 'repeat'); c.fillRect(0, 0, W, H); c.restore();
  window.READY = true;
})();
</script></body></html>
